name: Update VenuePilot Signup Links

on:
  schedule:
    - cron: '0 6 * * 3'    # Every Wednesday at 6am UTC (1am EST)
  workflow_dispatch:        # Allow manual trigger

concurrency:
  group: venuepilot-link-sync
  cancel-in-progress: false

jobs:
  update-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update VenuePilot links
        run: node api/scripts/update-venuepilot-links.js

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- api/mics.json)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Open or update signup link review PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: codex/automated-venuepilot-links
          title: Review signup link updates
          commit-message: Prepare signup link updates
          draft: true
          add-paths: api/mics.json
          body: Review signup links before merging; database synchronization runs separately after merge.
