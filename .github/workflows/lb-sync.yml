name: Laughing Buddha Sync

on:
  schedule:
    - cron: '0 10 * * 1'  # Every Monday at 10am UTC (6am ET)
  workflow_dispatch:       # Allow manual trigger from GitHub UI

concurrency:
  group: lb-mic-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Scrape Laughing Buddha site
        run: node scripts/check-laughing-buddha.js

      - name: Apply changes to mics.json
        run: node scripts/apply-lb-changes.js --remove-stale

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet api/mics.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Open PR if mics.json changed
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: codex/automated-lb-mics
          draft: true
          add-paths: api/mics.json
          title: "🎤 LB sync: update Laughing Buddha mics"
          body: |
            Automated weekly sync with [laughingbuddhacomedy.com/mics](https://www.laughingbuddhacomedy.com/mics).

            Review additions and removals before merging. Merge synchronization preserves existing IDs
            and stops if database identities are absent from the approved seed. Schedule changes and
            removals require a separate reviewed data migration; do not run a destructive reseed.
          commit-message: "Update Laughing Buddha mics from weekly sync"
          labels: mics-sync
